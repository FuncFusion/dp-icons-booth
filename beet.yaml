output: "build"

pipeline:
  - data_pack:
      load: ["src"]
    resource_pack:
      load: ["src"]
    require:
      - bolt
      - bolt_expressions
    meta:
      bolt:
        entrypoint:
          "dpi:main"
    pipeline:
      - mecha

  - data_pack:
      load:
        - "https://vendors.internal.smithed.net/app/static/summit-dp-core.zip"
    resource_pack:
      load:
        - "https://vendors.internal.smithed.net/app/static/summit-rp-core.zip"
